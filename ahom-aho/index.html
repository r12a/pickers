<script>
function togglePali (state) {
    pali = document.querySelectorAll('.x')
    if (state) {
        for (i=0;i<pali.length;i++) pali[i].style.display = 'inline'
        document.getElementById('paliToggle').textContent = 'Hide Pali'
        }
    else {
        for (i=0;i<pali.length;i++) pali[i].style.display = 'none'
        document.getElementById('paliToggle').textContent = 'Show Pali'
        }
    }
</script>

<div class="spaceline">
<span class="touch" dir="auto" id="paliToggle" onClick="if (this.textContent.includes('Show')) togglePali(true); else togglePali(false)">Show Pali</span>
