<div style="text-align: center;cursor: pointer;" data-digits="western"
    onclick="
        if (this.dataset.digits==='western'){current='western';next='myanmar';}
        else {current='myanmar';next='western';}
        this.dataset.digits=next;
        rows = this.parentNode.querySelectorAll('.'+next);
        for (let i=0;i<rows.length;i++) {rows[i].style.display='block';}
        rows = this.parentNode.querySelectorAll('.'+current);
        for (let i=0;i<rows.length;i++) {rows[i].style.display='none';}
        "
    ><span style="font-size:70%; color:tan;">change digits</span></div>
